experiment:
  name: "RPA"
  description: "A two gene robust perfect adaptation circuit with real data"

model:
    type: "ODE" # Can be an "SDE" or "ReactionSystem"
    states: ["A", "B"]

equations:
    A: |
      0.02 * (alpha_1 / (1 + (kcymRtot / (1 + cuma / kx1))^nx1) + beta_1) *
            (alpha_2 * (B^nx2) / (kx2^nx2 + B^nx2) + beta_2) - 0.02 * r1 * A

    B: | 
      0.02 * (alpha_3 * (B^nx2) / (kx3^nx2 + B^nx2) + beta_3) *
            (alpha_4 / (1 + (A / kr)^nr) + beta_4) - 0.1 * r2 * B

simulation:
    tspan: [0.0, 10.0]
    solver: "Rosenbrock23"

# Parameters (provided values in the orgininal RPA work)
parameters:
  alpha_1:
    value: 88.0
    role: design
    bounds: [10.0, 200.0] # TODO bounds? 

  alpha_2:
    value: 149.0
    role: design
    bounds: [10.0, 200.0] # TODO bounds?

  alpha_3:
    value: 18.4
    role: design
    bounds: [10.0, 200.0] # TODO bounds?

  alpha_4:
    value: 2.2e7
    role: design
    bounds: [10.0, 200000000.0] # TODO bounds?

  beta_1:
    value: 6.5
    role: uncertain
    prior:
      distribution: uniform
      lower: 0.0
      upper: 10.0 # TODO bounds?

  beta_2:
    value: 3.9e-4
    role: uncertain
    prior:
      distribution: uniform
      lower: 0.0
      upper: 1.0

  beta_3:
    value: 3.32
    role: uncertain
    prior:
      distribution: uniform
      lower: 0.0
      upper: 10.0 # TODO bounds?

  beta_4:
    value: 3.4
    role: uncertain
    prior:
      distribution: uniform
      lower: 0.0
      upper: 10.0 # TODO bounds?

  kx1:
    value: 1.28e-8
    role: fixed

  nx1:
    value: 2.34
    role: fixed

  kcymRtot:
    value: 2.75e3
    role: fixed

  kx2:
    value: 119.0
    role: fixed

  nx2:
    value: 1.3
    role: fixed

  kr:
    value: 0.51
    role: fixed

  nr:
    value: 3.2
    role: fixed

  r1:
    value: 45.0
    role: fixed

  r2:
    value: 15.2
    role: fixed

  kx3:
    value: 4006.9
    role: fixed
  
  cuma:
    value: 2.0e-6
    role: fixed

inputs:
    type: "step"
    t_threshold: 50
    values: [1,10]
   
