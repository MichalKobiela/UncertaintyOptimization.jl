experiment:
  name: "RPA"
  description: "A two gene robust perfect adaptation circuit with real data"

model:
    type: "ODE" # Can be an "SDE" or "ReactionSystem"
    states: ["A", "B"]

equations:
  A: |
    0.02 * (alpha_1 / (1 + (kcymRtot / (1 + cuma / kx1))^nx1) + beta_1) *
          (alpha_2 * (max(B, 0)^nx2) / (kx2^nx2 + max(B, 0)^nx2) + beta_2) -
          0.02 * r1 * max(A, 0)

  B: |
    0.02 * (alpha_3 * (max(B, 0)^nx2) / (kx3^nx2 + max(B, 0)^nx2) + beta_3) *
          (alpha_4 / (1 + (max(A, 0) / kr)^nr) + beta_4) -
          0.1 * r2 * max(B, 0)

simulation:
    tspan: [0.0, 10.0]
    solver: "Rosenbrock23"

# Parameters (provided values in the orgininal RPA work)
parameters:
  alpha_1:
    value: 83.4743
    role: uncertain
    prior:
      distribution: uniform
      lower: 0.0
      upper: 2000.0

  alpha_2:
    # value: 10.0
    value: 391.1627
    role: uncertain
    prior:
      distribution: uniform
      lower: 0.0
      upper: 250.0   # bug

  alpha_3:
    value: 17.7437
    role: uncertain
    prior:
      distribution: uniform
      lower: 0.0
      upper: 1e4

  alpha_4:
    value: 8.7519e6
    role: uncertain
    prior:
      distribution: uniform
      lower: 0.0
      upper: 1e13

  beta_1:
    value: 11.9586
    role: uncertain
    prior:
      distribution: uniform
      lower: 0.0
      upper: 200.0

  beta_2:
    value: 3.9e-4
    role: uncertain
    prior:
      distribution: uniform
      lower: 0.0
      upper: 100.0

  beta_3:
    value: 0.6644
    role: uncertain
    prior:
      distribution: uniform
      lower: 0.0
      upper: 5e3

  beta_4:
    value: 7.1347
    role: uncertain
    prior:
      distribution: uniform
      lower: 0.0
      upper: 5000.0

  kx1:
    value: 1.28e-8
    role: uncertain
    prior:
      distribution: uniform
      lower: 0.0
      upper: 3e-8

  nx1:
    value: 2.34
    role: uncertain
    prior:
      distribution: uniform
      lower: 1.0
      upper: 5.0

  kcymRtot:
    value: 2.75e3
    role: fixed

  kx2:
    value: 36.4063
    role: uncertain
    prior:
      distribution: uniform
      lower: 0.0
      upper: 1e4
    # role: design
    # bounds: [0.0, 1e4]
    design:
      parameters:
        cuma:
          warmup_value: 2e-6
          value: 0.0003
      optimise:
        LinRange: [0.01, 3, 100]
        type: min # find and return the value that produces the best loss

  nx2:
    value: 1.3
    role: uncertain
    prior:
      distribution: uniform
      lower: 1.0
      upper: 10.0

  kr:
    value: 0.51
    role: uncertain
    prior:
      distribution: uniform
      lower: 0.0
      upper: 100.0

  nr:
    value: 3.2
    role: uncertain
    prior:
      distribution: uniform
      lower: 1.0
      upper: 100.0

  r1:
    value: 89.0635
    role: uncertain
    prior:
      distribution: uniform
      lower: 0.0
      upper: 1000.0

  r2:
    value: 7.0188
    role: uncertain
    prior:
      distribution: uniform
      lower: 0.0
      upper: 1000.0

  kx3:
    value: 4006.9
    role: fixed
  
  cuma:
    warmup_value: 2e-6
    value: [2e-5, 0.0001, 0.001]
    role: fixed

inputs:
    type: "step"
    t_threshold: 50
    values: [1, 10]
   