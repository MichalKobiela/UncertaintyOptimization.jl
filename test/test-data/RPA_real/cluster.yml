experiment:
  name: "RPA"
  description: "A two gene robust perfect adaptation circuit with real data"

model:
    type: "ODE" # Can be an "SDE" or "ReactionSystem"
    states: ["A", "B"]

equations:
  A: |
    0.02 * (alpha_1 / (1 + exp(nx1 * (log(kcymRtot + 1e-12) - (log(kx1 + cuma + 1e-12) - log(kx1 + 1e-12))))) + beta_1) *
          (alpha_2 / (1 + exp(nx2 * (log(kx2 + 1e-12) - log(((B + sqrt(B^2 + 1e-12)) / 2) + 1e-12)))) + beta_2) -
          0.02 * r1 * ((A + sqrt(A^2 + 1e-12)) / 2)

  B: |
    0.02 * (alpha_3 / (1 + exp(nx2 * (log(kx3 + 1e-12) - log(((B + sqrt(B^2 + 1e-12)) / 2) + 1e-12)))) + beta_3) *
          (alpha_4 / (1 + exp(nr * (log(((A + sqrt(A^2 + 1e-12)) / 2) + 1e-12) - log(kr + 1e-12)))) + beta_4) -
          0.1 * r2 * ((B + sqrt(B^2 + 1e-12)) / 2)

simulation:
    tspan: [0.0, 10.0]
    solver: "Rosenbrock23"

